<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daruma Horror Model Preview</title>
  <style>
    html, body { margin:0; height:100%; background:#050202; color:#eee; font-family:system-ui,sans-serif; overflow:hidden; }
    #info { position:fixed; left:18px; top:16px; z-index:2; padding:12px 14px; background:rgba(0,0,0,.58); border:1px solid rgba(255,255,255,.18); line-height:1.55; }
    #info b { color:#ff3333; }
    canvas { display:block; width:100%; height:100%; }
  </style>
</head>
<body>
  <div id="info">
    <b>Daruma Horror Preview</b><br>
    ゲーム未実装の確認用モデル<br>
    左ドラッグ: 回転 / ホイール: 拡大縮小
  </div>
  <script type="module">
    import * as THREE from './node_modules/three/build/three.module.js';
    import { GLTFLoader } from './node_modules/three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from './node_modules/three/examples/jsm/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.88;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050202);
    scene.fog = new THREE.Fog(0x050202, 5.5, 12);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.58, 6.6);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0x806060, 0x080303, 1.1));
    const key = new THREE.SpotLight(0xffb3a0, 7.2, 12, Math.PI / 5, 0.65, 1.05);
    key.position.set(-2.2, 4, 3.8);
    scene.add(key);
    const side = new THREE.PointLight(0x7b0000, 2.1, 7);
    side.position.set(2.6, 1.4, 2.2);
    scene.add(side);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(2.4, 96),
      new THREE.MeshStandardMaterial({ color:0x100707, roughness:.95 }),
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    new GLTFLoader().load('./public/models/daruma_horror_preview.glb', (gltf) => {
      scene.add(gltf.scene);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
