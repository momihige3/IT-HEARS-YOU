<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daruma Horror Model Preview</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #050202;
      color: #eee;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    #info {
      position: fixed;
      left: 18px;
      top: 16px;
      z-index: 2;
      padding: 12px 14px;
      background: rgba(0, 0, 0, .58);
      border: 1px solid rgba(255, 255, 255, .18);
      line-height: 1.55;
    }

    #info b {
      color: #ff3333;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="info">
    <b>Daruma Horror Preview</b><br>
    ゲーム未実装の確認用モデル<br>
    左ドラッグ: 回転 / ホイール: 拡大縮小
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050202);
    scene.fog = new THREE.Fog(0x050202, 7.5, 16);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.58, 6.6);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xa08078, 0x100404, 1.25));

    const key = new THREE.SpotLight(0xffc0a8, 9.0, 14, Math.PI / 4.8, 0.58, 1.0);
    key.position.set(-2.5, 4.2, 4.2);
    scene.add(key);

    const fill = new THREE.PointLight(0x8a130d, 3.0, 8);
    fill.position.set(2.8, 1.6, 3.0);
    scene.add(fill);

    const front = new THREE.PointLight(0xff6f55, 1.8, 6);
    front.position.set(0, 1.6, 3.8);
    scene.add(front);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(2.4, 96),
      new THREE.MeshStandardMaterial({ color: 0x100707, roughness: .95 }),
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const loader = new GLTFLoader();
    loader.load('./models/daruma_horror_preview.glb', (gltf) => {
      scene.add(gltf.scene);
    }, undefined, (error) => {
      const warn = document.createElement('div');
      warn.style.cssText = 'position:fixed;left:18px;bottom:18px;color:#ff7777;background:#220;padding:10px 12px;z-index:3';
      warn.textContent = `モデル読み込み失敗: ${error?.message || error}`;
      document.body.appendChild(warn);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
