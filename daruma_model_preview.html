<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daruma Horror Model Preview</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #120b0b;
      color: #eee;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }

    #info {
      position: fixed;
      left: 18px;
      top: 16px;
      z-index: 2;
      padding: 12px 14px;
      background: rgba(0, 0, 0, .62);
      border: 1px solid rgba(255, 255, 255, .18);
      line-height: 1.55;
    }

    #info b {
      color: #ff3333;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="info">
    <b>Daruma Texture Preview</b><br>
    ゲームオーバー用画像を直接テクスチャ化<br>
    左ドラッグ: 回転 / ホイール: 拡大縮小
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x120b0b);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.42, 6.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffd7c4, 0x170505, 1.9));

    const key = new THREE.SpotLight(0xffc7a5, 7.5, 15, Math.PI / 4.8, 0.62, 1.05);
    key.position.set(-2.2, 4.3, 4.1);
    scene.add(key);

    const front = new THREE.PointLight(0xff765c, 2.4, 7);
    front.position.set(0, 1.5, 4.0);
    scene.add(front);

    const group = new THREE.Group();
    group.name = 'DARUMA_IMAGE_TEXTURE_MODEL_PREVIEW';
    scene.add(group);

    const shell = new THREE.Mesh(
      new THREE.SphereGeometry(1.42, 96, 64),
      new THREE.MeshStandardMaterial({
        color: 0x5c0604,
        roughness: .86,
        metalness: .02,
        emissive: 0x120000,
        emissiveIntensity: .08,
      }),
    );
    shell.scale.set(1.08, 1.22, .72);
    shell.position.y = 1.18;
    group.add(shell);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(2.5, 96),
      new THREE.MeshStandardMaterial({ color: 0x2a1714, roughness: .95 }),
    );
    floor.rotation.x = -Math.PI / 2;
    group.add(floor);

    async function makeDarumaTexture() {
      const image = new Image();
      image.src = './images/daruma_gameover.png';
      await image.decode();

      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      const clipDarumaSilhouette = () => {
        ctx.beginPath();
        ctx.moveTo(512, 64);
        ctx.bezierCurveTo(295, 78, 210, 270, 210, 530);
        ctx.bezierCurveTo(210, 820, 325, 955, 512, 955);
        ctx.bezierCurveTo(699, 955, 814, 820, 814, 530);
        ctx.bezierCurveTo(814, 270, 729, 78, 512, 64);
        ctx.closePath();
      };

      clipDarumaSilhouette();
      ctx.clip();
      ctx.drawImage(image, 285, 18, 990, 970, 76, 34, 872, 925);

      const vignette = ctx.createRadialGradient(512, 450, 250, 512, 525, 565);
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(0.72, 'rgba(0,0,0,.02)');
      vignette.addColorStop(1, 'rgba(0,0,0,.34)');
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      ctx.globalCompositeOperation = 'destination-in';
      clipDarumaSilhouette();
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    async function initDarumaTextureModel() {
      const texture = await makeDarumaTexture();
      const frontMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(2.72, 3.08, 24, 24),
        new THREE.MeshStandardMaterial({
          map: texture,
          transparent: true,
          roughness: .62,
          metalness: .01,
          side: THREE.DoubleSide,
          depthWrite: true,
        }),
      );
      frontMesh.name = 'daruma_gameover_image_texture_front';
      frontMesh.position.set(0, 1.32, 1.04);
      group.add(frontMesh);
    }

    initDarumaTextureModel().catch((error) => {
      const warn = document.createElement('div');
      warn.style.cssText = 'position:fixed;left:18px;bottom:18px;color:#ff7777;background:#220;padding:10px 12px;z-index:3';
      warn.textContent = `画像テクスチャ読み込み失敗: ${error?.message || error}`;
      document.body.appendChild(warn);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
