<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050706" />
    <title>IT HEARS YOU</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="game"></div>

      <div id="vignette"></div>
      <div id="danger-flash"></div>
      <div id="locker-slats" aria-hidden="true"></div>

      <header id="hud">
        <div class="objective"><span>OBJECTIVE</span><strong id="objective-text">鍵を探せ</strong></div>
        <div class="status-cluster">
          <div class="status-row"><span>NOISE</span><div class="meter"><i id="noise-bar"></i></div><b id="noise-value">00</b></div>
          <div class="status-row"><span>DETECTION</span><div class="meter detection"><i id="detect-bar"></i></div><b id="detect-value">00</b></div>
          <div class="alert-line"><span id="alert-dot"></span><strong id="alert-text">UNNOTICED</strong></div>
        </div>
      </header>

      <div id="crosshair"><i></i><i></i><i></i><i></i></div>
      <div id="prompt"></div>

      <div id="bottom-hud">
        <div class="mode-panel">
          <small>MOVEMENT</small>
          <strong id="move-mode">WALKING</strong>
          <div><span>CTRL CROUCH</span><span>SHIFT RUN</span></div>
        </div>
        <div class="battery-panel">
          <span class="flash-icon">⌁</span>
          <div><small>FLASHLIGHT</small><strong id="battery-value">100%</strong></div>
          <div class="battery"><i id="battery-bar"></i></div>
          <kbd>F</kbd>
        </div>
      </div>

      <section id="start-screen" class="screen visible">
        <div class="title-block">
          <p class="eyebrow">A FIRST-PERSON HORROR EXPERIENCE</p>
          <h1>IT<br><em>HEARS</em><br>YOU</h1>
          <p class="tagline">静かに。ここでは、足音が命取りになる。</p>
          <button id="start-button"><span>ENTER THE HALLWAY</span><small>クリックして開始</small></button>
          <div class="controls">
            <span><b>WASD</b> 移動</span><span><b>MOUSE</b> 視点</span><span><b>SHIFT</b> 走る</span>
            <span><b>CTRL</b> しゃがむ</span><span><b>E</b> 調べる / 隠れる</span><span><b>F</b> ライト</span>
          </div>
        </div>
        <div class="version">HEADPHONES RECOMMENDED <i></i> v1.0</div>
      </section>

      <section id="message-screen" class="screen">
        <div class="message-card"><p id="message-kicker"></p><h2 id="message-title"></h2><p id="message-body"></p><button id="restart-button">もう一度</button></div>
      </section>

      <div id="toast"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
